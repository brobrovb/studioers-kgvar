
name: Update daily KG Var candidates

on:
  workflow_dispatch:
  schedule:
    - cron: "0 1 * * *"

permissions:
  contents: write

concurrency:
  group: kgvar-daily-update
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build KG Var candidates and update history
        run: python gunun_kgvar.py

      - name: Commit and push JSON files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add docs/kgvar.json docs/kgvar-history.json

          if git diff --cached --quiet; then
            echo "No changes to save."
            exit 0
          fi

          git commit -m "Update KG Var predictions and results"
          git push
